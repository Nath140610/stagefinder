services:
  - type: web
    name: stagefinder
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_ENABLE_GMAIL
        value: "true"
      - key: VITE_TRACKING_PIXEL
        value: "true"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: VITE_LEGAL_NAME
        sync: false
      - key: VITE_LEGAL_ADDRESS
        sync: false
      - key: VITE_LEGAL_EMAIL
        sync: false
      - key: VITE_LEGAL_PHONE
        sync: false
      - key: VITE_LEGAL_SIRET
        sync: false
      - key: VITE_LEGAL_MEDIATOR
        sync: false
      - key: VITE_LEGAL_HOST
        sync: false
      - key: VITE_LEGAL_VAT
        sync: false
